# SonarQube Configuration
sonar.projectKey=ai-leadgen-platform
sonar.projectName=AI Lead Generation Platform
sonar.projectVersion=1.0

# Source code paths
sonar.sources=client/src,server,shared
sonar.tests=client/src,server,shared
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/migrations/**

# Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results.xml

# Language-specific properties
sonar.typescript.node.maxspace=4096

# Code Quality Gates
sonar.qualitygate.wait=true

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Security
sonar.security.hotspots.inheritFromParent=true